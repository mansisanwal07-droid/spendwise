<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>SpendWise - Personal Expense Tracker</title>
    <style>
        :root {
            --primary: #2563eb;
            --primary-hover: #1d4ed8;
            --background: #f8fafc;
            --surface: #ffffff;
            --text: #1e293b;
            --border: #e2e8f0;
            --success: #10b981;
            --danger: #ef4444;
            --danger-hover: #dc2626;
        }

        body {
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
            background-color: var(--background);
            color: var(--text);
            margin: 0;
            padding: 20px;
            display: flex;
            justify-content: center;
        }

        .container {
            width: 100%;
            max-width: 600px;
            background: var(--surface);
            padding: 30px;
            border-radius: 12px;
            box-shadow: 0 4px 6px -1px rgb(0 0 0 / 0.1), 0 2px 4px -2px rgb(0 0 0 / 0.1);
        }

        h1 {
            text-align: center;
            margin-top: 0;
            color: var(--primary);
        }

        .total-box {
            background: #eff6ff;
            border: 1px solid #bfdbfe;
            padding: 15px;
            border-radius: 8px;
            text-align: center;
            font-size: 1.25rem;
            font-weight: bold;
            margin-bottom: 20px;
        }

        .analytics-box {
            background: #f1f5f9;
            border: 1px solid var(--border);
            padding: 15px;
            border-radius: 8px;
            margin-bottom: 25px;
        }
        
        .analytics-title {
            font-size: 0.95rem;
            font-weight: bold;
            margin: 0 0 10px 0;
            color: #475569;
            text-transform: uppercase;
            letter-spacing: 0.05em;
        }
        
        .analytics-grid {
            display: grid;
            grid-template-columns: repeat(auto-fit, minmax(100px, 1fr));
            gap: 10px;
            font-size: 0.85rem;
        }
        
        .analytics-chip {
            background: var(--surface);
            padding: 8px;
            border-radius: 6px;
            border: 1px solid var(--border);
            text-align: center;
        }

        .form-group {
            margin-bottom: 15px;
        }

        label {
            display: block;
            margin-bottom: 5px;
            font-weight: 500;
            font-size: 0.9rem;
        }

        input, select {
            width: 100%;
            padding: 10px;
            border: 1px solid var(--border);
            border-radius: 6px;
            box-sizing: border-box;
            font-size: 1rem;
        }

        input:focus, select:focus {
            outline: 2px solid var(--primary);
        }

        .btn-container {
            display: flex;
            gap: 10px;
            margin-top: 5px;
        }

        button {
            width: 100%;
            background-color: var(--primary);
            color: white;
            border: none;
            padding: 12px;
            font-size: 1rem;
            font-weight: 600;
            border-radius: 6px;
            cursor: pointer;
            transition: background-color 0.2s;
        }

        button:hover {
            background-color: var(--primary-hover);
        }

        button.btn-clear {
            background-color: #94a3b8;
            width: 35%;
        }
        
        button.btn-clear:hover {
            background-color: #64748b;
        }

        .history-section {
            margin-top: 30px;
        }

        table {
            width: 100%;
            border-collapse: collapse;
            margin-top: 10px;
        }

        th, td {
            text-align: left;
            padding: 12px;
            border-bottom: 1px solid var(--border);
        }

        th {
            background-color: #f1f5f9;
            font-weight: 600;
        }

        .no-data {
            text-align: center;
            color: #64748b;
            font-style: italic;
            padding: 20px;
        }
    </style>
</head>
<body>

<div class="container">
    <h1>SpendWise</h1>
    
    <div class="total-box">
         Total Cumulative Spending: ₹<span id="totalSpending">0.00</span>
    </div>

    <div class="analytics-box">
        <p class="analytics-title">Category Breakdown</p>
        <div id="analyticsGrid" class="analytics-grid">
        </div>
    </div>

    <form id="expenseForm">
        <div class="form-group">
            <label for="itemName">Item Name</label>
            <input type="text" id="itemName" placeholder="e.g., Book, Lunch" required>
        </div>
        
        <div class="form-group">
            <label for="amount">Amount Spent (₹)</label>
            <input type="number" id="amount" step="0.01" min="0.01" placeholder="0.00" required>
        </div>

        <div class="form-group">
            <label for="category">Category</label>
            <select id="category" required>
                <option value="" disabled selected>Select a category</option>
                <option value="Food">Food</option>
                <option value="Education">Education</option>
                <option value="Travel">Travel</option>
                <option value="Entertainment">Entertainment</option>
                <option value="Other">Other</option>
            </select>
        </div>

        <div class="btn-container">
            <button type="submit">Add Expense</button>
            <button type="button" class="btn-clear" id="clearBtn">Clear All</button>
        </div>
    </form>

    <div class="history-section">
        <h3>Your Expenses</h3>
        <table>
            <thead>
                <tr>
                    <th>Item</th>
                    <th>Category</th>
                    <th>Amount</th>
                </tr>
            </thead>
            <tbody id="expenseTableBody"></tbody>
        </table>
        <div id="noDataMessage" class="no-data">No expenses recorded yet!</div>
    </div>
</div>

<script>
    let expenses = JSON.parse(localStorage.getItem('spendwise_expenses')) || [];

    const expenseForm = document.getElementById('expenseForm');
    const expenseTableBody = document.getElementById('expenseTableBody');
    const noDataMessage = document.getElementById('noDataMessage');
    const totalSpendingEl = document.getElementById('totalSpending');
    const analyticsGrid = document.getElementById('analyticsGrid');
    const clearBtn = document.getElementById('clearBtn');

    function updateUI() {
        expenseTableBody.innerHTML = '';
        let total = 0;

        const categoryTotals = { Food: 0, Education: 0, Travel: 0, Entertainment: 0, Other: 0 };

        if (expenses.length === 0) {
            noDataMessage.style.display = 'block';
        } else {
            noDataMessage.style.display = 'none';
            
            expenses.forEach(exp => {
                total += exp.amount;
                
                if (categoryTotals[exp.category] !== undefined) {
                    categoryTotals[exp.category] += exp.amount;
                }

                const row = document.createElement('tr');
                row.innerHTML = `
                    <td>${escapeHtml(exp.item)}</td>
                    <td>${escapeHtml(exp.category)}</td>
                    <td>₹${exp.amount.toFixed(2)}</td>
                `;
                expenseTableBody.appendChild(row);
            });
        }

        totalSpendingEl.textContent = total.toFixed(2);
        renderAnalytics(categoryTotals);
    }

    function renderAnalytics(categoryTotals) {
        analyticsGrid.innerHTML = '';
        for (const [category, amount] of Object.entries(categoryTotals)) {
            if (amount > 0) {
                const chip = document.createElement('div');
                chip.className = 'analytics-chip';
                chip.innerHTML = `strong>${category}</strong><br>₹${amount.toFixed(2)}`;
                analyticsGrid.appendChild(chip);
            }
        }
        
        if (analyticsGrid.innerHTML === '') {
            analyticsGrid.innerHTML = `<p style="margin:0; color:#64748b; font-style:italic;">No active insights available.</p>`;
        }
    }

    expenseForm.addEventListener('submit', function(e) {
        e.preventDefault();

        const item = document.getElementById('itemName').value.trim();
        const amount = parseFloat(document.getElementById('amount').value);
        const category = document.getElementById('category').value;

        const newExpense = { item, amount, category };
        expenses.push(newExpense);

        localStorage.setItem('spendwise_expenses', JSON.stringify(expenses));

        expenseForm.reset();
        updateUI();
    });

    clearBtn.addEventListener('click', function() {
        if (confirm("Are you sure you want to delete all recorded expenses?")) {
            expenses = [];
            localStorage.removeItem('spendwise_expenses');
            updateUI();
        }
    });

    function escapeHtml(str) {
        return str.replace(/&/g, "&amp;").replace(/</g, "&lt;").replace(/>/g, "&gt;");
    }

    updateUI();
</script>

</body>
</html>
